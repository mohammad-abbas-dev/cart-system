<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shop.css" />
    <title>Cart System</title>
  </head>
  <body>
    <header>
      <div class="top-viewables">
        <div class="main-logo">
          <img src="main-logo.png" alt="hello" />
        </div>

        <nav class="navbar">
          <button id="cart">
            <svg
              class="w-[36px] h-[36px] text-gray-800 dark:text-white"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"
              />
            </svg>
          </button>
          <button><a href="index.html">Home</a></button>
          <button>Menu</button>
          <button>Blog</button>
          <button>Contact</button>
        </nav>
      </div>
    </header>

    <div class="menu">
      <div class="item-add">
        <div class="plus"></div>
      </div>

      <div class="item item1">
        <img src="shake1.png" alt="shake1" />

        <h2>Strawberry Shake</h2>

        <p class="description">
          Lorem ipsum dolor sit amet consectetur adipisicing elit.
        </p>

        <h3>
          <span class="h3price">12.99</span> <span class="h3dollar">$</span>
        </h3>

        <button class="add-to-cart">Add To Cart</button>
      </div>

      <div class="item item2">
        <img src="shake2.png" alt="shake1" />
        <h2>Milk Shake</h2>
        <p class="description">
          Lorem ipsum dolor sit amet consectetur adipisicing elit.
        </p>
        <h3>
          <span class="h3price">10.99</span> <span class="h3dollar">$</span>
        </h3>
        <button class="add-to-cart">Add To Cart</button>
      </div>

      <div class="item item3">
        <img src="shake4.png" alt="shake1" />
        <h2>caramel Shake</h2>
        <p class="description">
          Lorem ipsum dolor sit amet consectetur adipisicing elit.
        </p>
        <h3>
          <span class="h3price">14.99</span> <span class="h3dollar">$</span>
        </h3>
        <button class="add-to-cart">Add To Cart</button>
      </div>
    </div>

    <div class="edit-pop-up hidden">
      <div class="remove-container">
        <div class="remove-edit-pop-up"></div>
      </div>
      <div class="edit-center">
        <form id="form"></form>
      </div>
    </div>

    <div class="cart-pop-up-background">
      <div class="cart-pop-up-container">
        <div class="cart-items-pop-up">
          <div class="x"><button>x</button></div>
        </div>

        <div class="total">
          <p>Total:</p>
          <p class="price">0</p>
        </div>
      </div>
    </div>

    <script src="shop.js"></script>
  </body>
</html>
